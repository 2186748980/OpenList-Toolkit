name: Sync dependent services on OpenList stop
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'chore: sync dependent stop') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stop_openlist
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('openlist.sh')
          s = p.read_text()
          old = re.search(r'^stop_openlist\(\)\{.*?^\}\n', s, re.M | re.S)
          if not old:
              raise SystemExit('stop_openlist not found')
          new = '''stop_openlist(){
              : > "$MANUAL_STOP_FILE"
              local openlist_was_running=0
              running && openlist_was_running=1

              if systemd && [ -f /etc/systemd/system/openlist-toolkit.service ]; then
                  systemctl stop openlist-toolkit.service >/dev/null 2>&1 || true
              elif [ -f "$PID_FILE" ]; then
                  local p="$(cat "$PID_FILE" 2>/dev/null || true)"
                  [ -z "$p" ] || kill "$p" 2>/dev/null || true
                  rm -f "$PID_FILE"
              fi

              stop_ariang
              stop_aria2

              local failed=0
              if running; then
                  err 'OpenList 停止失败，仍在运行。'
                  failed=1
              else
                  ok 'OpenList 已停止。'
              fi
              if ariang_running; then
                  err 'AriaNg 停止失败，仍在运行。'
                  failed=1
              else
                  ok 'AriaNg 已同步停止。'
              fi
              if aria2_running; then
                  err 'aria2 停止失败，仍在运行。'
                  failed=1
              else
                  ok 'aria2 已同步停止。'
              fi
              [ "$failed" -eq 0 ]
          }
'''
          p.write_text(s[:old.start()] + new + s[old.end():])
          PY
          bash -n openlist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openlist.sh
          git rm .github/workflows/stop-sync-fix.yml
          git commit -m 'chore: sync dependent stop'
          git push origin HEAD:main
