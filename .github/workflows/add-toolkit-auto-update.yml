name: Add Toolkit startup update check

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch openlist.sh
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('openlist.sh')
          s = p.read_text()

          marker = 'auto_update_toolkit(){'
          if marker not in s:
              fn = r'''auto_update_toolkit(){
              [ -t 0 ] || return 0
              local latest src choice
              latest="$(toolkit_version)"
              [ -n "$latest" ] || return 0
              [ "$TOOLKIT_VERSION" = "$latest" ] && return 0
              src="${BASH_SOURCE[0]}"
              if [ -d "$(dirname "$src")/.git" ] && has git && [ -n "$(git -C "$(dirname "$src")" status --porcelain 2>/dev/null)" ]; then
                  warn '检测到 Toolkit 本地有未提交修改，已跳过自动更新。'
                  return 0
              fi
              echo
              warn "发现 Toolkit 新版本：v$latest（当前 v$TOOLKIT_VERSION）"
              printf '是否立即更新？(Y/n)：'
              read -r choice
              [[ "$choice" =~ ^[Nn]$ ]] && return 0
              self_update || return 0
              echo
              info '正在重新加载最新 Toolkit...'
              exec "$src"
          }
          '''
              s = s.replace('self_update(){', fn + 'self_update(){', 1)

          old = '*) mkdir -p "$(dirname "$SHORTCUT")"; [ "${BASH_SOURCE[0]}" = "$SHORTCUT" ] || { cp "${BASH_SOURCE[0]}" "$SHORTCUT" 2>/dev/null || true; }; chmod +x "$SHORTCUT" 2>/dev/null || true; check_version_bg; menu;;'
          new = '*) mkdir -p "$(dirname "$SHORTCUT")"; [ "${BASH_SOURCE[0]}" = "$SHORTCUT" ] || { cp "${BASH_SOURCE[0]}" "$SHORTCUT" 2>/dev/null || true; }; chmod +x "$SHORTCUT" 2>/dev/null || true; auto_update_toolkit; check_version_bg; menu;;'
          if old not in s:
              raise SystemExit('startup case pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate and commit
        shell: bash
        run: |
          bash -n openlist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openlist.sh
          git rm .github/workflows/add-toolkit-auto-update.yml
          git commit -m 'feat: check toolkit updates on startup'
          git push
