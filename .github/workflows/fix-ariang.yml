name: Fix AriaNg downloader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AriaNg latest release detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openlist.sh')
          s = p.read_text()
          old = '''ariang_latest(){ api_get "https://api.github.com/repos/$ARIANG_REPO/releases/latest" | sed -n 's/.*\"browser_download_url\":\"\([^\"]*AllInOne\.zip\)\".*/\1/p' | head -n1; }'''
          new = r'''ariang_latest(){
              local tag url
              tag=""
              if has curl; then
                  tag="$(curl -fsSL --retry 2 --connect-timeout 8 -o /dev/null -w '%{url_effective}' 'https://github.com/'"$ARIANG_REPO"'/releases/latest' 2>/dev/null | sed 's#.*/tag/##' | tr -d '\r\n')"
              elif has wget; then
                  tag="$(wget --max-redirect=10 --server-response --spider 'https://github.com/'"$ARIANG_REPO"'/releases/latest' 2>&1 | sed -n 's#.*Location: https://github.com/'"$ARIANG_REPO"'/releases/tag/##p' | tail -n1 | tr -d '\r')"
              fi
              [ -n "$tag" ] || tag="1.3.14"
              url="https://github.com/$ARIANG_REPO/releases/download/$tag/AriaNg-$tag-AllInOne.zip"
              if has curl; then
                  curl -fsIL --retry 2 --connect-timeout 8 "$url" >/dev/null 2>&1 && printf '%s\n' "$url"
              elif has wget; then
                  wget --spider -q --timeout=8 "$url" >/dev/null 2>&1 && printf '%s\n' "$url"
              fi
          }'''
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n openlist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openlist.sh
          git commit -m 'fix: make AriaNg release detection robust'
          git rm .github/workflows/fix-ariang.yml
          git commit -m 'chore: remove temporary AriaNg fix workflow'
          git push
