name: Patch OpenList start flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch start_openlist
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('openlist.sh')
          s = p.read_text()

          new = r'''offer_start_aria2_ariang(){
              [ -t 0 ] || return 0
              printf '是否同时启动 aria2 和 AriaNg？(y/n)：'
              read -r c
              [[ "$c" =~ ^[Yy]$ ]] || return 0
              echo
              info '正在启动 aria2...'
              start_aria2
              echo
              info '正在启动 AriaNg...'
              start_ariang
          }
          start_openlist(){
              rm -f "$MANUAL_STOP_FILE"; mkdirs; [ -x "$BINARY" ] || { err 'OpenList 尚未安装，请先选择 1。'; return 1; }
              if systemd && [ -f /etc/systemd/system/openlist-toolkit.service ]; then
                  if systemctl start openlist-toolkit.service; then
                      ok 'OpenList 已启动。'
                      offer_start_aria2_ariang
                  else
                      err '启动失败，请查看日志。'
                      return 1
                  fi
                  return
              fi
              running && { warn 'OpenList 已经在运行。'; return; }
              nohup "$BINARY" server --data "$DATA_DIR" >"$LOG_DIR/openlist.log" 2>&1 & local p=$!
              printf '%s\n' "$p" > "$PID_FILE"
              sleep 0.5
              if running; then
                  ok "OpenList 已启动，PID：$p"
                  offer_start_aria2_ariang
              else
                  err '启动失败，请查看日志。'
                  rm -f "$PID_FILE"
                  return 1
              fi
          }
          '''

          pattern = r'start_openlist\(\)\{.*?\n\}\nstop_openlist\(\)\{'
          if not re.search(pattern, s, re.S):
              raise SystemExit('start_openlist block not found')
          s = re.sub(pattern, new + 'stop_openlist(){', s, count=1, flags=re.S)
          p.write_text(s)
      - name: Validate and commit
        shell: bash
        run: |
          bash -n openlist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openlist.sh
          git rm .github/workflows/patch-openlist-start-all.yml
          git commit -m 'feat: optionally start aria2 and AriaNg with OpenList'
          git push
