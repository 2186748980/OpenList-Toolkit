name: Fix OpenList start prompt
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch script
        shell: python
        run: |
          from pathlib import Path
          p=Path('openlist.sh')
          s=p.read_text()
          old='running() && { warn \'OpenList 已经在运行。\'; return; }'
          new='running() && { warn \'OpenList 已经在运行。\'; offer_start_aria2_ariang; return; }'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
      - name: Validate and commit
        run: |
          bash -n openlist.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openlist.sh
          git rm .github/workflows/fix-start-prompt.yml
          git commit -m 'fix: prompt for aria2 and AriaNg when OpenList is already running'
          git push
