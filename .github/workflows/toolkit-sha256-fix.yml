name: Toolkit SHA-256 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[toolkit-sha256-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Toolkit build display
        shell: bash
        run: |
          set -e
          sed -i 's/center "v\$TOOLKIT_VERSION"/center "Toolkit：$(toolkit_build_id)"/' openlist.sh
          rm -f 3.1-migration-notice.txt
          bash -n openlist.sh
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openlist.sh
          git add -u 3.1-migration-notice.txt
          git diff --cached --quiet || git commit -m "fix: finalize SHA-256 toolkit migration [toolkit-sha256-fix]"
          git push origin HEAD:main
